<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Publicar Puesto</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>

<body>
<main>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white"
           th:href="@{/presentation/empresas/show}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto d-flex align-items-center">
            <span class="text-white mr-3 small"
                  th:text="${correo != null ? correo : 'Sesión iniciada'}">
                correo@ejemplo.com
            </span>

            <a class="btn btn-navbar mr-2"
               th:href="@{/presentation/empresas/puestos}">
                Mis puestos
            </a>

            <a class="btn btn-publicar mr-2"
               th:href="@{/presentation/empresas/show}">
                Dashboard
            </a>

            <a class="btn btn-login"
               th:href="@{/logout}">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container hero-section text-center">
        <h1 class="titulo">Publicar Puesto</h1>
        <p class="subtitulo">
            Completa la información del puesto y selecciona los requisitos
        </p>
    </div>

    <div class="container mt-4 mb-5">

        <div th:if="${error != null}"
             class="alert alert-danger text-center"
             th:text="${error}">
            Error
        </div>

        <div th:if="${mensaje != null}"
             class="alert alert-success text-center"
             th:text="${mensaje}">
            Éxito
        </div>

        <div class="card shadow">
            <div class="card-body">

                <form th:action="@{/presentation/empresas/publicar}" method="post">

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion"
                                  name="descripcion"
                                  class="form-control"
                                  rows="4"
                                  maxlength="300"
                                  required
                                  th:text="${puesto != null ? puesto.descripcion : ''}">
                        </textarea>
                    </div>

                    <div class="form-row">

                        <div class="form-group col-md-6">
                            <label for="salario">Salario</label>
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   id="salario"
                                   name="salario"
                                   class="form-control"
                                   required
                                   th:value="${puesto != null ? puesto.salario : ''}">
                        </div>

                        <div class="form-group col-md-6">
                            <label for="tipo">Tipo de Publicación</label>
                            <select id="tipo"
                                    name="tipo"
                                    class="form-control"
                                    required>

                                <option value="">Seleccione una opción</option>

                                <option value="PUBLICO"
                                        th:selected="${puesto != null and puesto.tipo != null and puesto.tipo.name() == 'PUBLICO'}">
                                    Público
                                </option>

                                <option value="PRIVADO"
                                        th:selected="${puesto != null and puesto.tipo != null and puesto.tipo.name() == 'PRIVADO'}">
                                    Privado
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12 d-flex align-items-center">
                            <div class="form-check mt-4">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="activo"
                                       name="activo"
                                       value="true"
                                       th:checked="${puesto != null and puesto.activo}">

                                <label class="form-check-label" for="activo">
                                    Publicar como activo
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">
                            Características y nivel requerido
                        </label>

                        <div class="contenedor-caracteristicas">

                            <ul class="lista-caracteristicas">
                                <th:block th:each="nodoItem : ${arbolCaracteristicas}">
                                    <th:block th:replace="~{::nodo(
                                        nodo=${nodoItem},
                                        mostrarNivel=${true},
                                        inputName='caracteristicasSeleccionadas'
                                    )}">
                                    </th:block>
                                </th:block>
                            </ul>

                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-publicar mr-2">
                            Guardar Puesto
                        </button>

                        <a class="btn btn-secondary"
                           th:href="@{/presentation/empresas/show}">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<th:block th:fragment="nodo(nodo, mostrarNivel, inputName)">

    <li th:if="${nodo != null and nodo.caracteristica != null}">

        <div class="row align-items-center mb-2">

            <div class="col-md-8">
                <div class="form-check">

                    <input class="form-check-input"
                           type="checkbox"
                           th:name="${inputName}"
                           th:value="${nodo.caracteristica.id}"
                           th:id="'car_' + ${nodo.caracteristica.id}">

                    <label class="form-check-label"
                           th:for="'car_' + ${nodo.caracteristica.id}"
                           th:text="${nodo.caracteristica.nombre}">
                        Nombre
                    </label>
                </div>
            </div>

            <div class="col-md-4"
                 th:if="${mostrarNivel != null and mostrarNivel}">

                <select class="form-control"
                        th:name="'nivel_' + ${nodo.caracteristica.id}">

                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>
        </div>

        <ul th:if="${nodo.hijos != null and !#lists.isEmpty(nodo.hijos)}"
            class="ml-4">

            <th:block th:each="hijo : ${nodo.hijos}">
                <th:block th:replace="~{::nodo(
                    nodo=${hijo},
                    mostrarNivel=${mostrarNivel},
                    inputName=${inputName}
                )}">
                </th:block>
            </th:block>

        </ul>

    </li>

</th:block>

</body>
</html>
