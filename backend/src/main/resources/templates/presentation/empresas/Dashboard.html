<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Empresas</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>

<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white"
           href="/presentation/empresas/show"
           th:href="@{/presentation/empresas/show}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto">
            <span class="text-white mr-3 small"
                  th:text="${correo != null ? correo : 'Sesión iniciada'}">

            </span>
            <a class="btn btn-navbar mr-2"
               href="/presentation/empresas/puestos"
               th:href="@{/presentation/empresas/puestos}">
                Mis puestos
            </a>

            <a class="btn btn-publicar mr-2"
               href="/presentation/empresas/publicar"
               th:href="@{/presentation/empresas/publicar}">
                Publicar puesto
            </a>

            <a class="btn btn-login"
               href="/logout"
               th:href="@{/logout}">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container hero-section">
        <h1 class="titulo">Panel de la Empresa</h1>
        <p class="subtitulo">Administra tus puestos y revisa candidatos</p>
    </div>

    <div class="container mt-4 mb-5">
        <div th:if="${error != null}"
             class="alert alert-danger text-center"
             th:text="${error}">
            Error
        </div>

        <div class="row justify-content-center">
            <div class="col-md-4 mb-4">
                <div class="card puesto-card shadow h-100 text-center">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mis puestos</h5>
                        <p class="flex-grow-1">Consulta y edita los puestos activos.</p>
                        <a class="btn btn-detalle btn-sm mt-auto"
                           href="/presentation/empresas/puestos"
                           th:href="@{/presentation/empresas/puestos}">
                            Ver puestos
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card puesto-card shadow h-100 text-center">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Publicar</h5>
                        <p class="flex-grow-1">Crea nuevos puestos.</p>
                        <a class="btn btn-detalle btn-sm mt-auto"
                           href="/presentation/empresas/publicar"
                           th:href="@{/presentation/empresas/publicar}">
                            Publicar puesto
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
