<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Puestos</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>
<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white" th:href="@{/presentation/empresas/show}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto">
              <span class="text-white mr-3 small"
                    th:text="${correo != null ? correo : 'Sesión iniciada'}">

            </span>
            <a class="btn btn-navbar active mr-2" th:href="@{/presentation/empresas/puestos}">
                Mis puestos
            </a>
            <a class="btn btn-publicar mr-2" th:href="@{/presentation/empresas/publicar}">
                Publicar puesto
            </a>
            <a class="btn btn-login" th:href="@{/logout}">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container hero-section text-center">
        <h1 class="titulo">Mis Puestos</h1>

    </div>

    <div class="container mt-4 mb-5">
        <div th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}">
            Error
        </div>

        <div class="table-responsive">
            <table class="table tabla-custom">
                <thead class="tabla-header">
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Salario</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${puestos == null or #lists.isEmpty(puestos)}">
                    <td colspan="5" class="text-center text-muted">
                        No hay puestos registrados.
                    </td>
                </tr>

                <tr th:each="p : ${puestos}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.descripcion}">Descripción del puesto</td>
                    <td>
                        ₡ <span th:text="${p.salario}">0</span>
                    </td>
                    <td>
                        <span th:if="${p.activo}" class="estado-activo">✔</span>
                        <span th:unless="${p.activo}" class="estado-inactivo">✘</span>
                    </td>
                    <td>
                        <div class="acciones-tabla">
                            <a class="btn-accion"
                               th:classappend="${p.activo} ? 'btn-desactivar' : 'btn-activar'"
                               th:href="@{/presentation/empresas/desactivar/{id}(id=${p.id})}"
                               th:text="${p.activo} ? 'Desactivar' : 'Activar'">
                            </a>

                            <a class="btn-accion btn-buscar"
                               th:href="@{/presentation/empresas/buscar(puestoId=${p.id})}">
                                Buscar candidatos
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>
</body>
</html>
