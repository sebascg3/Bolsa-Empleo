<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Candidatos</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>
<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white" th:href="@{/presentation/empresas/show}">Bolsa de Empleo</a>
        <div class="ml-auto">
              <span class="text-white mr-3 small"
                    th:text="${correo != null ? correo : 'Sesión iniciada'}">

            </span>
            <a class="btn btn-navbar mr-2" th:href="@{/presentation/empresas/puestos}">Mis puestos</a>
            <a class="btn btn-publicar mr-2" th:href="@{/presentation/empresas/publicar}">Publicar puesto</a>
            <a class="btn btn-login" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container hero-section text-center">
        <h1 class="titulo">Buscar Candidatos</h1>
    </div>
    <div class="container text-center mb-3" th:if="${puesto != null}">
        <h4>
            Puesto:
            <span th:text="${puesto.descripcion}">Descripción del puesto</span>
        </h4>
    </div>
    <div class="container mt-4 mb-5">

        <div th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}">
            Error
        </div>

        <h3 class="text-center mb-4">Resultados</h3>

        <div th:if="${oferentes == null or #lists.isEmpty(oferentes)}" class="alert alert-info text-center">
            No se encontraron candidatos para este puesto.
        </div>

        <div class="table-responsive" th:if="${oferentes != null and !#lists.isEmpty(oferentes)}">
            <table class="table tabla-custom">
                <thead class="tabla-header">
                <tr>
                    <th>Oferente</th>
                    <th>Requisitos cumplidos</th>
                    <th>% de coincidencia</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${oferentes}">
                    <td th:text="${o.usuario.nombre}">Nombre del oferente</td>
                    <td>
                        <span th:text="${requisitosCumplidos[o.id]}">0</span> /
                        <span th:text="${totalRequisitos}">0</span>
                    </td>
                    <td>
                        <span th:text="${porcentajes[o.id]}">0</span>%
                    </td>
                    <td>
                        <a class="btn-accion btn-buscar"
                           th:href="@{/presentation/empresas/candidato/{id}(id=${o.id})}">
                            Ver detalle
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
