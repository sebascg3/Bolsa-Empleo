<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />

    <link rel="stylesheet" th:href="@{/css/Styles.css}">
    <title>Login</title>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto">
            <a class="btn btn-navbar mr-2" th:href="@{/puestos/buscar}">
                Buscar puestos
            </a>

            <a class="btn btn-empresa mr-2" th:href="@{/registro/empresa}">
                Registro Empresa
            </a>

            <a class="btn btn-oferente mr-2" th:href="@{/registro/oferente}">
                Registro Oferente
            </a>
        </div>
    </div>
</nav>

<h1 class="titulo-principal">Login</h1>

<main>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="icono-login">
                                <img th:src="@{/images/group.png}" alt="Usuario">
                            </div>
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger"
                             th:text="${session.loginError != null ? session.loginError : 'Correo o contraseña incorrectos'}">
                            Error de autenticación
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success">
                            Sesión cerrada correctamente
                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="form-group">
                                <label>Usuario</label>
                                <input type="email"
                                       name="correo"
                                       class="form-control"
                                       placeholder="Email"
                                       required />
                            </div>

                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="Contraseña"
                                       required />
                            </div>

                            <button class="btn btn-loginView btn-block" type="submit">
                                Entrar
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

</body>
</html>
