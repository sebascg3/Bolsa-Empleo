<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Bolsa de Empleo</title>


    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">


    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>

<body>
<main>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand text-white" th:href="@{/}">
        Bolsa de Empleo
    </a>

    <div class="ml-auto">
        <a class="btn btn-login mr-2" th:href="@{/login}">
            Iniciar sesión
        </a>
        <a class="btn btn-oferente mr-2" th:href="@{/registro/oferente}">
            Registrar Oferente
        </a>
        <a class="btn btn-empresa mr-2" th:href="@{/registro/empresa}">
            Registrar empresa
        </a>
        <a class="btn btn-navbar mr-2" th:href="@{/puestos/buscar}">
            Buscar puestos
        </a>
    </div>
</nav>


<div class="container text-center hero-section">
    <h1 class="titulo">Bolsa de Empleo</h1>
    <p class="subtitulo">Encuentra oportunidades o publica tus ofertas</p>

</div>


<div class="container recent-jobs-section">
    <h3 class="text-center mb-4">Últimos 5 puestos publicados</h3>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="p : ${puestosRecientes}">
            <div class="card puesto-card shadow">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.descripcion}">Nombre del puesto</h5>

                    <p>₡
                        <span th:text="${p.salario}"></span>
                    </p>

                    <p>
                        <span th:text="${p.idEmpresa != null ? p.idEmpresa.usuario.nombre : 'N/A'}"></span>
                    </p>

                    <button type="button"
                            class="btn btn-detalle btn-sm"
                            data-toggle="collapse"
                            th:data-target="'#infoPuesto__' + ${p.id}"
                            th:aria-controls="'infoPuesto__' + ${p.id}">
                        Ver detalle
                    </button>

                    <div class="collapse mt-3" th:id="'infoPuesto__' + ${p.id}">
                        <div class="detalle-box">




                            <div th:if="${p.puestoCaracteristicas != null and !#lists.isEmpty(p.puestoCaracteristicas)}">
                                <ul class="mb-0">
                                    <li th:each="pc : ${p.puestoCaracteristicas}">
                                        <span th:text="${pc.idCaracteristica.nombre}">Característica</span>
                                        -
                                        Nivel:
                                        <span th:text="${pc.nivel}">0</span>
                                    </li>
                                </ul>
                            </div>
                            <div th:if="${p.puestoCaracteristicas == null or #lists.isEmpty(p.puestoCaracteristicas)}">
                                <p class="mb-0 text-muted">Sin características registradas.</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>


</main>
<!-- ================= FOOTER ================= -->
<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
