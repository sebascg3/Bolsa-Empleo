<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Empresa</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand text-white" th:href="@{/}">
        Bolsa de Empleo
    </a>

    <div class="ml-auto">
        <a class="btn btn-login mr-2" th:href="@{/login}">Iniciar sesión</a>
        <a class="btn btn-oferente mr-2" th:href="@{/registro/oferente}">
            Registrar Oferente
        </a>
        <a class="btn btn-navbar" th:href="@{/puestos/buscar}">Buscar puestos</a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">Registro de Empresa</h2>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/registro/empresa}" method="post">

                        <h4 class="mb-3">Datos de usuario</h4>

                        <div class="form-group">
                            <label for="nombre">Nombre de la empresa</label>
                            <input type="text"
                                   id="nombre"
                                   name="nombre"
                                   class="form-control"
                                   th:value="${usuario.nombre}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="correo">Correo electrónico</label>
                            <input type="email"
                                   id="correo"
                                   name="correo"
                                   class="form-control"
                                   th:value="${usuario.correo}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   th:value="${usuario.password}"
                                   required>
                        </div>

                        <input type="hidden" name="rol" value="EMPRESA">
                        <input type="hidden" name="activo" value="true">

                        <hr class="my-4">

                        <h4 class="mb-3">Datos de la empresa</h4>

                        <div class="form-group">
                            <label for="ubicacion">Ubicación</label>
                            <input type="text"
                                   id="ubicacion"
                                   name="ubicacion"
                                   class="form-control"
                                   th:value="${empresa.ubicacion}">
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="text"
                                   id="telefono"
                                   name="telefono"
                                   class="form-control"
                                   th:value="${empresa.telefono}">
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion"
                                      name="descripcion"
                                      class="form-control"
                                      rows="4"
                                      th:text="${empresa.descripcion}"></textarea>
                        </div>

                        <input type="hidden" name="aprobado" value="false">

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary mr-2">
                                Registrar empresa
                            </button>
                            <a th:href="@{/}" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer text-center py-3">
    <p class="mb-0">© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
