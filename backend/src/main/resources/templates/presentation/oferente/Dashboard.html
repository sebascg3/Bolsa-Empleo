<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Oferente</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>
<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white"
           th:href="@{/presentation/oferentes/show}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto d-flex align-items-center">
            <span class="text-white mr-3 small"
                  th:text="${correo != null ? correo : 'Sesión iniciada'}">

            </span>

            <a class="btn btn-publicar mr-2"
               th:href="@{/presentation/oferentes/habilidades}">
                Mis habilidades
            </a>
            <a class="btn btn-caracteristicas mr-2"
               th:href="@{/presentation/oferentes/cv}">
                Mi CV
            </a>
            <a class="btn btn-login"
               th:href="@{/logout}">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container hero-section">
        <h1 class="titulo">Panel del Oferente</h1>
        <p class="subtitulo">Administra tu perfil, habilidades y CV</p>
    </div>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-4 mb-4">
                <div class="card puesto-card shadow h-100 text-center">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mis habilidades</h5>
                        <p class="flex-grow-1">Agrega, edita o elimina tus habilidades.</p>
                        <a class="btn btn-detalle btn-sm mt-auto"
                           th:href="@{/presentation/oferentes/habilidades}">
                            Gestionar habilidades
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card puesto-card shadow h-100 text-center">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mi CV</h5>
                        <p class="flex-grow-1">Sube o actualiza tu currículum.</p>
                        <a class="btn btn-detalle btn-sm mt-auto"
                           th:href="@{/presentation/oferentes/cv}">
                            Administrar CV
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
