<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Habilidades</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>
<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white"
           th:href="@{/presentation/oferentes/show}">
            Bolsa de Empleo
        </a>

        <div class="ml-auto d-flex align-items-center">
            <span class="text-white mr-3 small"
                  th:text="${correo != null ? correo : 'Sesión iniciada'}">
                correo@ejemplo.com
            </span>

            <a class="btn btn-navbar mr-2"
               th:href="@{/presentation/oferentes/show}">
                Dashboard
            </a>
            <a class="btn btn-caracteristicas mr-2"
               th:href="@{/presentation/oferentes/cv}">
                Mi CV
            </a>
            <a class="btn btn-login"
               th:href="@{/logout}">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container hero-section text-center">
        <h1 class="titulo">Mis Habilidades</h1>
        <p class="subtitulo">Selecciona tus habilidades y nivel de dominio</p>
    </div>

    <div class="container mt-4 mb-5">
        <div th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}">
            Error
        </div>
        <div th:if="${exito != null}" class="alert alert-success text-center" th:text="${exito}">
            Éxito
        </div>

        <div class="card shadow">
            <div class="card-body">
                <form th:action="@{/presentation/oferentes/habilidades}" method="post">

                    <div class="form-group">
                        <label class="font-weight-bold">Selecciona habilidades y nivel</label>
                        <div style="max-height: 320px; overflow-y: auto; border: 1px solid #ddd; padding: 12px; border-radius: 6px;">

                            <ul class="lista-caracteristicas">
                                <th:block th:each="nodoItem : ${arbolCaracteristicas}">
                                    <th:block th:replace="~{::nodo(
                                        nodo=${nodoItem},
                                        seleccionadas=${seleccionadas},
                                        niveles=${niveles},
                                        mostrarNivel=${true},
                                        inputName='caracteristicasSeleccionadas'
                                    )}"></th:block>
                                </th:block>
                            </ul>

                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-buscar mr-2">Guardar</button>
                        <a class="btn btn-secondary" th:href="@{/presentation/oferentes/show}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow mt-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Habilidades registradas</h5>

                <div th:if="${habilidades == null or #lists.isEmpty(habilidades)}" class="alert alert-info text-center">
                    Aún no has registrado habilidades.
                </div>

                <div class="table-responsive" th:if="${habilidades != null and !#lists.isEmpty(habilidades)}">
                    <table class="table tabla-custom">
                        <thead class="tabla-header">
                        <tr>
                            <th>Habilidad</th>
                            <th>Nivel</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="h : ${habilidades}">
                            <td th:text="${h.idCaracteristica.nombre}">Java</td>
                            <td th:text="${h.nivel}">4</td>
                            <td class="text-center">
                                <div class="acciones-tabla">
                                    <a class="btn-accion btn-publicar"
                                       th:href="@{/presentation/oferentes/habilidades/editar/{id}(id=${h.id})}">
                                        Editar
                                    </a>
                                    <a class="btn-accion btn-desactivar"
                                       th:href="@{/presentation/oferentes/habilidades/eliminar/{id}(id=${h.id})}"
                                       onclick="return confirm('¿Eliminar esta habilidad?');">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<th:block th:fragment="nodo(nodo, seleccionadas, niveles, mostrarNivel, inputName)">
    <li th:if="${nodo != null and nodo.caracteristica != null}">
        <div class="row align-items-center mb-2">
            <div class="col-md-8">
                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           th:name="${inputName}"
                           th:value="${nodo.caracteristica.id}"
                           th:id="'car_' + ${nodo.caracteristica.id}"
                           th:checked="${seleccionadas != null and seleccionadas.contains(nodo.caracteristica.id)}">

                    <label class="form-check-label"
                           th:for="'car_' + ${nodo.caracteristica.id}"
                           th:text="${nodo.caracteristica.nombre}">
                        Nombre
                    </label>
                </div>
            </div>

            <div class="col-md-4" th:if="${mostrarNivel != null and mostrarNivel}">
                <select class="form-control" th:name="'nivel_' + ${nodo.caracteristica.id}">
                    <option value="1" th:selected="${niveles != null and niveles[nodo.caracteristica.id] == 1}">Nivel 1</option>
                    <option value="2" th:selected="${niveles != null and niveles[nodo.caracteristica.id] == 2}">Nivel 2</option>
                    <option value="3" th:selected="${niveles != null and niveles[nodo.caracteristica.id] == 3}">Nivel 3</option>
                    <option value="4" th:selected="${niveles != null and niveles[nodo.caracteristica.id] == 4}">Nivel 4</option>
                    <option value="5" th:selected="${niveles != null and niveles[nodo.caracteristica.id] == 5}">Nivel 5</option>
                </select>
            </div>
        </div>

        <ul th:if="${nodo.hijos != null and !#lists.isEmpty(nodo.hijos)}" class="ml-4">
            <th:block th:each="hijo : ${nodo.hijos}">
                <th:block th:replace="~{::nodo(
                    nodo=${hijo},
                    seleccionadas=${seleccionadas},
                    niveles=${niveles},
                    mostrarNivel=${mostrarNivel},
                    inputName=${inputName}
                )}"></th:block>
            </th:block>
        </ul>
    </li>
</th:block>

</body>
</html>
