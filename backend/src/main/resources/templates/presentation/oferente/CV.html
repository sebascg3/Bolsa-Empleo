<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar CV</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body>
<main>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand text-white" th:href="@{/presentation/oferentes/show}">
            Bolsa de Empleo
        </a>
        <div class="ml-auto d-flex align-items-center">
            <span class="text-white mr-3 small"
                  th:text="${correo != null ? correo : 'Sesión iniciada'}">correo@ejemplo.com</span>
            <a class="btn btn-navbar mr-2"
               th:href="@{/presentation/oferentes/show}">
                Dashboard
            </a>
            <a class="btn btn-publicar mr-2" th:href="@{/presentation/oferentes/habilidades}">Mis habilidades</a>
            <a class="btn btn-login" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container hero-section text-center">
        <h1 class="titulo">Mi CV</h1>
        <p class="subtitulo">Sube o reemplaza tu currículum en PDF</p>
    </div>

    <div class="container mt-4 mb-5">
        <div th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}">Error</div>
        <div th:if="${exito != null}" class="alert alert-success text-center" th:text="${exito}">Éxito</div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Subir nuevo CV (PDF)</h5>
                <form th:action="@{/presentation/oferentes/cv}" method="post" enctype="multipart/form-data">
                    <div class="form-row align-items-end">
                        <div class="form-group col-md-8">
                            <label for="cv">Archivo PDF</label>
                            <input type="file" id="cv" name="cv" class="form-control" accept=".pdf,application/pdf" required>
                        </div>
                        <div class="form-group col-md-4">
                            <button type="submit" class="btn btn-buscar btn-block">Subir / Reemplazar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <h5 class="card-title mb-3">CV actual</h5>
                <div th:if="${oferente == null or oferente.cv == null}" class="alert alert-info text-center">
                    Aún no has subido un CV.
                </div>
                <div th:if="${oferente != null and oferente.cv != null}" class="d-flex flex-column flex-md-row align-items-center justify-content-between">
                    <a class="btn btn-cv mb-3 mb-md-0"
                       th:href="@{'/uploads/' + ${oferente.cv}}"
                       target="_blank">Ver CV</a>
                    <form th:action="@{/presentation/oferentes/cv/eliminar}" method="post" class="mb-0">
                        <button type="submit" class="btn btn-desactivar"
                                onclick="return confirm('¿Eliminar el CV actual?');">Eliminar CV</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Bolsa de Empleo</p>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
